# ============================================================
# AgentForge CI/CD 流水线
# ============================================================
# 这个文件放在 .github/workflows/ 目录下
# 每次 push 代码到 GitHub 时，GitHub 的服务器会自动执行这里定义的步骤
#
# 做的事情：
#   1. 拉代码
#   2. 装 Python 3.12 + 项目依赖
#   3. 跑全部测试（158 个用例）
#   4. 跑代码风格检查（ruff）
#
# 结果在 GitHub 仓库页面 → Actions 标签页可以看到
# 绿勾 ✅ = 全部通过，红叉 ❌ = 有测试挂了
# ============================================================

name: 测试 + 代码检查

# 什么时候触发？
on:
  push:                        # push 到 main 或 develop 分支时触发
    branches: [main, develop]
  pull_request:                # 有人提交 PR 时也触发
    branches: [main]

jobs:
  test:
    name: 跑测试
    runs-on: ubuntu-latest     # GitHub 免费提供的 Linux 服务器

    steps:
      # 第 1 步：拉代码
      - name: 拉取代码
        uses: actions/checkout@v4

      # 第 2 步：装 Python 3.12
      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 第 3 步：装项目依赖
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" 2>/dev/null || pip install -e .
          pip install pytest pytest-asyncio ruff

      # 第 4 步：跑测试（跳过需要联网的测试）
      - name: 跑测试
        run: |
          pytest tests/ -q --tb=short \
            --ignore=tests/test_agent.py \
            --ignore=tests/test_evaluation.py

      # 第 5 步：代码风格检查
      - name: 代码风格检查（ruff）
        run: ruff check agentforge/ || true
        # || true 表示风格检查不通过也不阻止（只是提醒）
